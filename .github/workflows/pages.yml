name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/omnilogic-local-sdk/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack (Yarn)
        run: |
          npm i -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # typedoc reads the SDK's built types
      - name: Build the SDK
        run: yarn workspace @rygine/omnilogic-local-sdk build

      # the site is served under the repository name, so the base is set here
      # rather than in the VitePress config
      - name: Build the site
        run: |
          yarn workspace @rygine/omnilogic-docs typedoc
          yarn workspace @rygine/omnilogic-docs vitepress build --base /omnilogic-local/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
