name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack (Yarn)
        run: |
          npm i -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The web app's component tests run in Chromium through Playwright.
      - name: Install Chromium
        run:
          yarn workspace @rygine/omnilogic-web playwright install --with-deps
          chromium

      # Build first: the type-aware lint rules need the SDK's dist types.
      - name: Run checks
        run: yarn ci
